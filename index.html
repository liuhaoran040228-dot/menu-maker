<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一张好菜单 · 价目表生成器</title>
<style>
:root{font-family:system-ui,"Noto Sans CJK SC",sans-serif;color:#263d36;background:#f5f3ec}*{box-sizing:border-box}body{margin:0}header{padding:28px max(20px,4vw);border-bottom:1px solid #d8ded5;display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;margin:0}header small{display:block;margin-top:7px;color:#63746b}.badge{font-size:12px;border:1px solid #bacbc0;border-radius:30px;padding:9px}main{max-width:1250px;margin:28px auto;display:grid;grid-template-columns:360px 1fr;gap:28px;padding:0 20px}.panel{background:white;border:1px solid #dfe3d9;border-radius:20px;padding:24px;align-self:start}h2{font-size:15px;margin:0 0 18px}label{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}input,textarea,select{width:100%;border:1px solid #ced6ce;background:#fcfcf8;border-radius:9px;padding:11px;font:inherit;font-size:14px;color:#203a31}textarea{resize:vertical;min-height:250px;line-height:1.8}input:focus,textarea:focus,select:focus{outline:2px solid #59957c}button{border:0;border-radius:10px;padding:13px 16px;font:inherit;cursor:pointer;background:#234d3e;color:white;width:100%;margin-top:12px}button.secondary{background:#f0f3eb;color:#234d3e}.hint{font-size:12px;line-height:1.8;color:#67766c}.stage{text-align:center;min-width:0}.stage canvas{width:min(100%,600px);height:auto;box-shadow:0 12px 45px #283a3022;border-radius:3px}.stage p{font-size:12px;color:#718075}#status{min-height:25px;color:#9e432b;font-size:13px}footer{text-align:center;color:#6a7a6e;font-size:12px;padding:24px}@media(max-width:760px){header .badge{display:none}main{grid-template-columns:1fr;margin-top:18px}.panel{padding:20px}.stage{order:-1}.stage canvas{width:min(100%,340px)}}@media print{header,.panel,footer,.stage p{display:none}main{display:block;margin:0;padding:0}.stage canvas{width:100%;box-shadow:none}@page{size:A4;margin:12mm}}
</style>
<header><div><h1>一张好菜单</h1><small>把日常的小生意，排得好看一点。</small></div><span class="badge">本地处理 · 无需注册 · 无上传</span></header>
<main><section class="panel"><h2>01 / 写下你的菜单</h2><label for="shop">店名或标题</label><input id="shop" maxlength="18" value="栗栗的小茶铺"><label for="subtitle">副标题</label><input id="subtitle" maxlength="36" value="慢慢喝，好好过日子"><label for="theme">配色</label><select id="theme"><option value="sage">苔绿奶油</option><option value="ink">深夜咖啡</option><option value="peach">蜜桃日常</option></select><label for="items">品名 | 价格（每行一项，最多18项）</label><textarea id="items" spellcheck="false">桂花乌龙 | 16
茉莉鲜奶茶 | 18
陈皮热红茶 | 15
海盐焦糖拿铁 | 22
栗子小蛋糕 | 19
今日手作饼干 | 12</textarea><p class="hint">可用半角 | 或全角 ｜ 分隔，品名最多24字，价格最多10字。可写“时价”。不填货币符号会自动添加 ¥。</p><label for="note">页脚说明</label><input id="note" maxlength="45" value="甜度可选 · 温暖供应"><div id="status" role="status" aria-live="polite"></div><button id="export">下载高清 PNG</button><button id="print" class="secondary">打印 / 保存 PDF</button><button id="reset" class="secondary">恢复示例</button><p class="hint">修改即预览。内容不存储、不联网，关闭或刷新会清空修改。PNG 为 1080 × 1560。手机若未自动下载，可长按下方导出图保存。打印窗口可选“另存为 PDF”。</p><a id="saveLink" hidden download="我的菜单.png">点击保存菜单图片</a></section><section class="stage"><canvas id="art" width="1080" height="1560" aria-label="菜单实时预览"></canvas><p>02 / 实时预览 · PNG无推广文字</p><img id="fallback" hidden style="max-width:100%" alt="导出的菜单，可长按保存"></section></main><footer>想要更精致的定制版可以找我<br><br>工具免费使用 · 不含在线收款或订单管理</footer>
<script>
const $=id=>document.getElementById(id),c=$('art'),x=c.getContext('2d');const demo=$('items').value;const themes={sage:['#f5f1e6','#304c3e','#9aab85'],ink:['#24332f','#f2e8d6','#b8a379'],peach:['#fff0e8','#874c3f','#d8a18b']};let valid=true;
function text(t,y,size=30,color,align='left',xx=94){x.fillStyle=color;x.font=`${size}px "Noto Sans CJK SC",sans-serif`;x.textAlign=align;x.fillText(t,xx,y)}
function wrap(t,max){let lines=[''];for(const ch of t){let i=lines.length-1;if(x.measureText(lines[i]+ch).width>max)lines.push(ch);else lines[i]+=ch}return lines}
function draw(){let [bg,fg,muted]=themes[$('theme').value];let raw=$('items').value.split('\n').filter(s=>s.trim()),items=[],error='';if(raw.length>18)error='最多18项，请分成两张菜单导出。';for(let i=0;i<raw.length;i++){let bits=raw[i].split(/[|｜]/);if(bits.length!==2||!bits[0].trim()||!bits[1].trim()){error=`第${i+1}行请写成：品名 | 价格`;break}if([...bits[0].trim()].length>24||[...bits[1].trim()].length>10){error=`第${i+1}行太长，请缩短品名或价格`;break}items.push(bits.map(s=>s.trim()))}if(!raw.length)error='请至少添加一项商品。';if(!$('shop').value.trim())error='请填写标题。';valid=!error;$('status').textContent=error;$('export').disabled=!valid;$('print').disabled=!valid;x.fillStyle=bg;x.fillRect(0,0,1080,1560);x.strokeStyle=muted;x.lineWidth=2;x.strokeRect(44,44,992,1472);text('S L O W   D A Y S',144,22,muted);text('MENU / 价目表',144,22,muted,'right',986);
x.font='bold 64px "Noto Sans CJK SC",sans-serif';let size=64;while(x.measureText($('shop').value).width>890&&size>28)x.font=`bold ${--size}px "Noto Sans CJK SC",sans-serif`;x.fillStyle=fg;x.textAlign='left';x.fillText($('shop').value||'你的店名',94,270);text($('subtitle').value,332,$('subtitle').value.length>32?23:25,fg);x.fillStyle=muted;x.fillRect(94,380,892,2);
let lineH=items.length>12?43:58,y=470;for(let [name,price] of items.slice(0,18)){let font=items.length>12?24:name.length>21?26:30;x.font=`${font}px "Noto Sans CJK SC",sans-serif`;let lines=wrap(name,650);for(let j=0;j<lines.length;j++)text(lines[j],y+j*(font+5),font,fg);let p=/^(¥|￥)/.test(price)?price:/^\d/.test(price)?'¥ '+price:price;text(p,y,font,fg,'right',986);y+=Math.max(lineH,lines.length*(font+5)+14)}x.fillStyle=muted;x.fillRect(94,1380,892,2);text($('note').value,1445,$('note').value.length>36?19:23,fg,'center',540);text('一  好 好 生 活  一',1490,17,muted,'center',540)}
for(const id of ['shop','subtitle','theme','items','note'])$(id).addEventListener('input',draw);
$('export').onclick=()=>{draw();if(!valid)return;c.toBlob(blob=>{const old=$('saveLink').href;if(old.startsWith('blob:'))URL.revokeObjectURL(old);let url=URL.createObjectURL(blob);$('saveLink').href=url;$('saveLink').hidden=false;$('saveLink').click();$('fallback').src=url;$('fallback').hidden=false;$('status').textContent='已生成高清 PNG，可点击保存或长按导出图。'},'image/png')};$('print').onclick=()=>{draw();if(valid)window.print()};$('reset').onclick=()=>{if(!confirm('恢复示例会清除当前修改，继续吗？'))return;$('shop').value='栗栗的小茶铺';$('subtitle').value='慢慢喝，好好过日子';$('items').value=demo;$('note').value='甜度可选 · 温暖供应';$('theme').value='sage';draw()};document.fonts.ready.then(draw);draw();
</script></html>
