<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><link rel="stylesheet" href="../style.css"><title>萌娘星光擂台 · 星糖萌娘社</title><link rel="stylesheet" href="../mobile-game.css"></head><body class="game arcade" data-game="fighter"><header class="page-head"><h1>萌娘星光擂台 ✧</h1><p>原创萌娘 · 免费试玩 · 进度保存在当前浏览器</p></header><main><div class="game-banner"><span id="buddy"></span><div><b>星糖游戏小宇宙</b>多关原创试炼 · 连击、星光技和终结技！</div></div><div class="hud"><span>得分 <b id="score">0</b> · 最高 <b id="best">0</b></span><span id="detail">准备出发</span></div><div class="health-row"><label>你 <progress id="hp" max="100" value="100"></progress></label><label><span id="enemyname">蓝蓝 · CPU</span> <progress id="enemyhp" max="100" value="100"></progress></label></div><label style="margin:4px 0;font-size:12px">星能 <b id="energyLabel">0/100</b><progress id="energy" max="100" value="0" style="width:100%;accent-color:#a084d7"></progress></label><canvas id="arena" width="420" height="350" aria-label="萌娘星光擂台游戏区域"></canvas><div class="controls"><button data-action="left" aria-label="←">←</button><button data-action="right" aria-label="→">→</button><button data-action="up" aria-label="跳">跳</button><button data-action="down" aria-label="防">防</button><button data-action="punch" aria-label="拳 J">拳 J</button><button data-action="kick" aria-label="踢 K">踢 K</button><button data-action="special" aria-label="星光 L">星光 L</button><button data-action="ultimate" aria-label="终结 O">终结 O</button></div><div class="bar"><button id="start">开始游戏</button><button id="pause" class="alt">暂停</button><button id="vipitem" class="alt">星光护盾 · VIP</button></div><div class="arcade-settings"><label for="character">免费角色<select id="character"></select></label><label for="costume">角色皮肤<select id="costume"><option value="0">原色 · 免费</option><option value="1">樱糖粉 · VIP</option><option value="2">星河蓝 · VIP</option></select></label></div><p id="msg" role="status"></p><p class="hint"><b data-flavor="fighterTip"></b><br>← → / AD 移动，↑ / W / 空格跳跃，↓ / S 防御。J 拳、K 踢、L 星光技（35 星能）。O 终结技需 100 星能。命中积累星能，连续命中加成；关卡递进，末关挑战星穹守护者。 VIP 道具每局一次。按 P 暂停；失去焦点自动暂停。</p></main><script>document.body.dataset.orientation="landscape";{const c=document.querySelector("canvas");if(c){c.width=840;c.height=Math.round(840*Math.min(innerWidth,innerHeight)/Math.max(innerWidth,innerHeight));}}</script><script src="../data/content.js"></script><script src="../data/flavor.js"></script><script src="../content.js"></script><script src="../data/scenes.js"></script><script src="../game-art.js"></script><script src="../chars.js"></script><script src="../ui.js"></script><script src="../vip.js"></script><script>document.querySelectorAll("[data-flavor]").forEach(e=>e.textContent=StarData.flavor[e.dataset.flavor]);</script><script src="../arcade.js"></script><script src="../game-view.js"></script></body></html>
