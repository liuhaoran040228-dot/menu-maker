<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><link rel="stylesheet" href="../style.css"><title>萌娘星风跑酷</title><style>.wardrobe{background:#fff9;padding:14px;border-radius:22px;margin-top:16px;border:1px solid white}.wardrobe h2{font-size:17px;margin:0 0 8px}.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.shop-card{border:1px solid #e5d8f3;padding:10px;border-radius:17px;background:#fff;font-size:11px;text-align:center}.shop-card.selected{border:2px solid #b39ade;background:#fbf5ff}.shop-card svg{width:72px;height:90px;display:block;margin:auto}.shop-card button{font-size:12px;padding:8px}.shop-card b{display:block}.vehicle-picture{height:80px;display:flex;align-items:center;justify-content:center;font-size:34px}</style><link rel="stylesheet" href="../mobile-game.css"></head><body class="game arcade"><header class="page-head"><h1>萌娘星风跑酷 ✧</h1><p>迎着糖果色的风，跳过烦恼，收集闪光。</p></header><main><div class="game-banner"><span id="buddy"></span><div><b>原创萌娘的星风小旅行</b>换上衣服，带上滑板，一起出发。</div></div><div class="hud"><span>距离 <b id="score">0</b> · 最高 <b id="best">0</b></span><span>金币 <b id="coins">0</b></span></div><canvas id="arena" width="420" height="330" aria-label="星风跑酷，点击跳跃，下滑滑行"></canvas><div class="controls"><button id="jump">跳 / 二段跳 ↑</button><button id="slide">滑行 ↓</button></div><div class="bar"><button id="start">开始跑酷</button><button id="pause" class="alt">暂停</button></div><p id="msg" role="status"></p><p class="hint"><b data-flavor="runnerTip"></b><br>点击画布 / 空格 / ↑ 跳跃（空中再按二段跳），下滑 / ↓ 滑行。吃金币解锁滑板；磁铁吸金币、护盾挡一次碰撞、冲刺短暂无敌。载具改变速度与跳跃。金币和衣橱只在当前浏览器保存。</p><div class="wardrobe"><h2>✦ 我的衣橱 <small>局外更换</small></h2><label>免费伙伴<select id="character"></select></label><div class="shop-grid" id="outfits"></div><h2 style="margin-top:18px">✧ 载具工坊</h2><div class="shop-grid" id="vehicles"></div><p class="hint">金币仅游戏内获得，不涉及充值或真实金钱。VIP 皮肤和飞行器随本地激活状态解锁。</p></div></main><script>document.body.dataset.orientation="landscape";{const c=document.querySelector("canvas");if(c){c.width=840;c.height=Math.round(840*Math.min(innerWidth,innerHeight)/Math.max(innerWidth,innerHeight));}}</script><script src="../data/content.js"></script><script src="../data/flavor.js"></script><script src="../content.js"></script><script src="../data/scenes.js"></script><script src="../game-art.js"></script><script src="../chars.js"></script><script src="../ui.js"></script><script src="../vip.js"></script><script>document.querySelectorAll("[data-flavor]").forEach(e=>e.textContent=StarData.flavor[e.dataset.flavor]);</script><script src="game.js"></script><script src="../game-view.js"></script></body></html>
