<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小红书 3:4 封面文字卡片</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#294b3c;font:16px system-ui,sans-serif}header,main,footer{max-width:1020px;margin:auto;padding:24px}h1{font-size:26px}main{display:grid;grid-template-columns:340px 1fr;gap:24px}.panel,.result{background:#fff;border:1px solid #e0e4d8;border-radius:22px;padding:24px;min-width:0}label{display:block;margin:15px 0 7px;font-size:14px}input,textarea,select,button{font:inherit;border-radius:10px;padding:11px;width:100%;border:1px solid #cbd6ca}textarea{min-height:180px;resize:vertical}button{background:#315c48;color:white;border:0;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}canvas,img{max-width:100%;height:auto}footer{text-align:center;font-size:13px;line-height:2}a{color:#315c48}small,.hint{color:#718075;font-size:13px}.card{padding:14px;background:#f5f3ec;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}#notice{white-space:pre-wrap}input[type=checkbox]{width:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}@media(max-width:720px){main{grid-template-columns:1fr;padding:14px}header{padding:22px}h1{font-size:23px}}</style><header><h1>小红书 3:4 封面文字卡片</h1><small>把日常的小事，做得轻松一点 · 本地处理，不上传内容</small></header><main><section class="panel"><label for="title">封面标题</label><textarea id="title" maxlength="70">把日子过成
喜欢的样子</textarea><label for="body">副标题</label><input id="body" maxlength="80" value="日常记录 · 小小确幸"><label for="note">署名 / 栏目</label><input id="note" maxlength="36" value="栗栗的慢日子"><label for="color">配色（免费2款，VIP全部）</label><select id="color"><option value="0">奶油苔绿</option><option value="1">蜜桃日常</option><option value="2">晴空蓝紫 · VIP</option><option value="3">深夜奶茶 · VIP</option><option value="4">暖黄手帐 · VIP</option></select><button id="download">下载封面 PNG</button><button id="batch">VIP：导出全部配色</button><p class="hint">1080 × 1440。批量下载可能需要浏览器允许多文件下载。</p><p id="notice" role="status"></p></section><section class="result"><canvas id="art" width="1080" height="1440"></canvas></section></main><footer>需要定制可以闲鱼找我<br><a href="../tools.html">← 更多小工具</a></footer><script src="../vip.js"></script><script>const $=id=>document.getElementById(id);function save(c,name){const a=document.createElement('a');a.download=name;a.href=c.toDataURL('image/png');a.click()}async function copy(t){try{await navigator.clipboard.writeText(t);$('notice').textContent='已复制'}catch(e){$('notice').textContent='自动复制不可用，请长按或选中文字复制'}}function mark(c){if(!VIP.active()){const x=c.getContext('2d');x.save();x.font=`${Math.max(18,c.width/28)}px sans-serif`;x.textAlign='right';x.fillStyle='#888';x.fillText('免费版',c.width-18,c.height-22);x.restore()}}const palettes=[['#f5f1e6','#304c3e'],['#fff0e8','#874c3f'],['#e9efff','#3e497b'],['#302e38','#fff2d9'],['#fff7cc','#71562f']];function colors(){return palettes[VIP.active()?+$('color').value:Math.min(1,+$('color').value)]}function wrap(ctx,t,max){let lines=[''];for(const ch of t){if(ch==='\n'){lines.push('');continue}let i=lines.length-1;if(ctx.measureText(lines[i]+ch).width>max)lines.push(ch);else lines[i]+=ch}return lines}
const c=$('art'),x=c.getContext('2d');function draw(){const [bg,fg]=colors();x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);x.fillStyle=fg;x.textAlign='left';x.font='bold 64px sans-serif';const title=wrap(x,$('title').value,880);title.slice(0,3).forEach((s,i)=>x.fillText(s,90,420+i*100));x.fillRect(90,800,900,3);x.font='34px sans-serif';let y=900;const lines=wrap(x,$('body').value,880);lines.slice(0,20).forEach(s=>{x.fillText(s,90,y);y+=48});x.font='26px sans-serif';wrap(x,$('note').value,880).slice(0,2).forEach((s,i)=>x.fillText(s,90,1320+i*40));mark(c)}document.querySelectorAll('input,textarea,select').forEach(e=>e.addEventListener('input',draw));$('download').onclick=()=>{draw();save(c,'我的海报.png')};window.addEventListener('vipchange',draw);draw();$('batch').onclick=async()=>{if(!VIP.active()){VIP.open();return}const original=$('color').value;for(let i=0;i<palettes.length;i++){$('color').value=i;draw();save(c,'封面-'+(i+1)+'.png');await new Promise(r=>setTimeout(r,250))}$('color').value=original;draw()};</script></html>
