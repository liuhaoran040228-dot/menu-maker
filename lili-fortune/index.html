<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><link rel="stylesheet" href="../style.css"><title>栗栗今日小运势</title><style> label{display:block;margin:10px 0 5px;font-size:14px}input,select{width:100%}canvas{width:100%;border-radius:18px;margin-top:12px;display:block}.row{display:flex;gap:8px}.row button{flex:1}main{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px!important;box-shadow:var(--shadow);margin-top:12px!important}.row button{margin-top:14px}canvas{box-shadow:0 10px 30px rgba(90,50,26,.15)}</style>
<link rel="stylesheet" href="../mobile-game.css"><body data-orientation="portrait" class="game"><header class="page-head"><h1>🔮 栗栗今日小运势</h1><p class="hint">输入昵称，抽一张今天的小卡片，仅供娱乐～</p></header>
<main><div class="game-banner"><span data-mascot="xing"></span><div><b>星糖萌娘社 · 今日陪伴</b>原创伙伴，陪你收集一点快乐。</div></div><label for="name">昵称</label><input id="name" maxlength="12" placeholder="比如：小栗子"><label for="mode">玩法</label><select id="mode"><option value="0">今日运势</option><option value="1">你是哪种小零食（性格小测）</option></select><label for="theme">卡片主题</label><select id="theme"><option value="0">栗栗原色</option><option value="1">樱糖萌娘 · VIP</option><option value="2">星河萌娘 · VIP</option></select><div class="row"><button class="primary" id="go">✨ 抽一张</button><button id="save" class="alt">保存分享卡 PNG</button></div><p id="msg" role="status"></p><canvas id="cv" width="1080" height="1440"></canvas><p id="best" class="hint"></p></main>
<footer>需要定制可以闲鱼找我<br><a href="../tools.html">← 更多小工具</a></footer><script src="../data/content.js"></script><script src="../data/flavor.js"></script><script src="../content.js"></script><script src="../data/scenes.js"></script><script src="../game-art.js"></script><script src="../chars.js"></script><script src="../ui.js"></script><script src="../vip.js"></script><script>document.getElementById('theme').innerHTML=StarData.skins.map(s=>'<option value="'+s.id+'">'+s.name+(s.vip?' · VIP':' · 免费')+'</option>').join('');document.querySelectorAll("[data-mascot]").forEach(e=>e.innerHTML=Chars.render(e.dataset.mascot));</script><script>
const $=i=>document.getElementById(i),cv=$('cv'),x=cv.getContext('2d');
const LUCK=['大吉','中吉','小吉','吉','平稳','小确幸'],COLORS=['栗子棕','奶油白','薄荷绿','蜜桃粉','雾霾蓝','柠檬黄','焦糖橙'],THINGS=['热可可','散步十分钟','整理书桌','给朋友发消息','早睡一小时','听一首老歌','吃点甜的'],WORDS=['慢慢来，比较快。','今天的你，值得一颗糖。','小事做好，就是大事。','好运正在排队来找你。','先照顾好自己，再照顾世界。','有点累就歇一下，没关系。','你笑起来的时候，运气最好。'];
const SNACK=[['🌰 糖炒栗子','外表有点硬，里面超级暖。熟了之后，朋友都离不开你。'],['🍡 三色团子','情绪丰富，一天能切换三种心情，但每种都很可爱。'],['🍪 黄油曲奇','可靠又治愈，总能在大家需要的时候出现。'],['🍮 焦糖布丁','看起来软软的，其实很有主见，底下藏着小惊喜。'],['🍩 甜甜圈','社交小达人，中间空着的地方留给新朋友。'],['🥐 可颂','讲究生活仪式感，一层一层都是认真。']];
const TH=[['#fff4e0','#7a4a24','#e8b27a'],['#ffe9f0','#8a3d5c','#f7a8c4'],['#1f2547','#fff2d9','#8fa2ff']];
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function theme(){return TH[Content.skinValue($('theme').value)]||TH[0]}
function wrap(t,max){let L=[''];for(const ch of t){let i=L.length-1;if(x.measureText(L[i]+ch).width>max)L.push(ch);else L[i]+=ch}return L}
function draw(){const name=$('name').value.trim()||'小栗子',mode=+$('mode').value,h=hash(name+today()+mode),[bg,fg,ac]=theme();GameArt.background(x,['bg-moon','bg-sakura','bg-undersea'][Content.skinValue($('theme').value)]||'bg-moon',1080,1440,0);x.fillStyle=bg;x.globalAlpha=.86;x.beginPath();x.roundRect(60,65,960,1290,35);x.fill();x.globalAlpha=1;GameArt.sprite(x,'ui-gold',60,65,960,1290);x.fillStyle=ac;x.globalAlpha=.25;for(let i=0;i<14;i++){x.beginPath();x.arc((hash('a'+i)%1080),(hash('b'+i)%1440),30+hash('c'+i)%60,0,7);x.fill()}x.globalAlpha=1;
 x.fillStyle=fg;x.textAlign='center';x.font='bold 52px sans-serif';x.fillText(mode?'你是哪种小零食？':'栗栗今日小运势',540,160);x.font='34px sans-serif';x.fillText(name+' · '+today(),540,230);Chars.draw(x,'xing',420,275,240,Content.skinValue($('theme').value),true);
 if(!mode){x.font='bold 120px sans-serif';x.fillText(LUCK[h%6],540,660);x.font='40px sans-serif';x.fillText('幸运色：'+COLORS[(h>>3)%7],540,780);x.fillText('宜：'+THINGS[(h>>6)%7],540,850);x.fillText('幸运数字：'+((h>>9)%9+1),540,920);x.font='italic 44px sans-serif';wrap('「'+WORDS[(h>>12)%7]+'」',860).forEach((s,i)=>x.fillText(s,540,1060+i*60))}
 else{const s=SNACK[h%SNACK.length];x.font='bold 90px sans-serif';x.fillText(s[0],540,680);x.font='42px sans-serif';wrap(s[1],860).forEach((t,i)=>x.fillText(t,540,820+i*64))}
 x.font='28px sans-serif';x.globalAlpha=.7;x.fillText('仅供娱乐 · 栗栗的日常小工具',540,1370);x.globalAlpha=1;
 if(!VIP.active()){x.save();x.globalAlpha=.18;x.font='bold 90px sans-serif';x.translate(540,720);x.rotate(-.5);x.fillText('免费版 · 栗栗',0,0);x.restore()}
 const n=(+localStorage.getItem('lili-fortune-count')||0);$('best').textContent='你已经抽过 '+n+' 次卡片'}
$('go').onclick=()=>{localStorage.setItem('lili-fortune-count',(+localStorage.getItem('lili-fortune-count')||0)+1);draw();$('msg').textContent='抽好啦，同一天同昵称结果固定哦'};
$('save').onclick=()=>{draw();const a=document.createElement('a');a.download='栗栗小运势.png';a.href=cv.toDataURL('image/png');a.click()};
$('theme').onchange=()=>{if(!Content.skinAllowed($('theme').value)){$('msg').textContent='更多主题、无水印需要 VIP';VIP.open()}draw()};$('mode').onchange=draw;addEventListener('vipchange',draw);draw();Chars.ready.then(draw);GameArt.ready.then(draw);
</script><script src="../game-view.js"></script></html>
