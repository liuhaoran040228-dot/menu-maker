<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1628">
  <title>蓝蓝的幻光蛇境</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect fill='%230a4a7d' width='16' height='16'/><circle cx='8' cy='8' r='3' fill='%2300d4ff'/></svg>">
  <link rel="stylesheet" href="../fx.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="fx">
  
  <div id="game-root" class="game-root">
    <canvas id="game-canvas" class="game-canvas"></canvas>
    <div class="map-caption"><span id="mode-label">幻光蛇境</span><small>最佳 <b id="best-val">0</b></small></div>
    <div class="game-hud">
      <div class="hud-left">
        <div class="score-chip">
          <span class="chip-label">分数</span>
          <span class="chip-value" id="score-val">0</span>
        </div>
        <div class="combo-chip" id="combo-chip" style="display:none">
          <span class="chip-label">连击</span>
          <span class="chip-value" id="combo-val">1</span>
        </div>
      </div>
      <div class="hud-right">
        <div class="goal-chip" id="goal-chip" style="display:none">
          <span class="chip-label" id="goal-label">目标</span>
          <span class="chip-value"><span id="eaten-val">0</span>/<span id="goal-val">12</span></span>
        </div>
        <div class="power-chips">
          <div class="power-chip" id="power-speed" style="display:none" title="加速" aria-label="加速">
            <div class="power-bar"></div>
            <svg viewBox="0 0 16 16"><path d="M2 8h12M8 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          </div>
          <div class="power-chip" id="power-magnet" style="display:none" title="磁石" aria-label="磁石">
            <div class="power-bar"></div>
            <svg viewBox="0 0 16 16"><path d="M4 2h8v12H4z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 6v4M10 6v4" stroke="currentColor" stroke-width="1"/></svg>
          </div>
          <div class="power-chip" id="power-shield" style="display:none" title="护盾" aria-label="护盾">
            <div class="power-bar"></div>
            <svg viewBox="0 0 16 16"><path d="M8 2L3 5v4c0 3 5 4 5 4s5-1 5-4V5l-5-3z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          </div>
        </div>
      </div>
    </div>
    <div class="game-controls">
      <button id="boost-btn" class="boost-btn" title="加速冲刺" aria-label="加速冲刺" >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </button>
      <button id="gear-btn" class="gear-btn" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="2"/>
          <path d="M12 1v6m0 10v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m10 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
      </button>
      <button id="pause-btn" class="pause-btn" title="暂停" aria-label="暂停">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>
    </div>
    <div id="virtual-joystick" class="virtual-joystick" style="display:none">
      <div class="joystick-bg"></div>
      <div class="joystick-knob"></div>
    </div>
  </div>
  <div id="result-panel" class="result-panel" style="display:none">
    <div class="result-content">
      <div class="result-header" id="result-header">游戏结束</div>
      <div class="result-stats">
        <div class="stat-row">
          <span class="stat-label">最终分数</span>
          <span class="stat-value" id="final-score">0</span>
        </div>
        <div class="stat-row" id="length-row" style="display:none">
          <span class="stat-label">蛇长</span>
          <span class="stat-value" id="final-length">4</span>
        </div>
        <div class="stat-row" id="combo-row" style="display:none">
          <span class="stat-label">最高连击</span>
          <span class="stat-value" id="final-combo">1</span>
        </div>
      </div>
      <div class="result-actions">
        <button id="replay-btn" class="result-btn replay-btn" style="display:none" title="重放" aria-label="重放">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 7v10a5 5 0 0 0 5 5h5m-5-15v-2h-2v2h2zM3 7h8"/>
          </svg>
        </button>
        <button id="finish-btn" class="result-btn finish-btn" title="完成" aria-label="完成">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div id="settings-overlay" class="settings-overlay" style="display:none">
    <div class="settings-panel">
      <div class="settings-header">设置</div>
      <div class="settings-content">
        <div class="setting-item">
          <label for="control-select">控制方式</label>
          <select id="control-select">
            <option value="swipe">滑动</option>
            <option value="joystick">虚拟摇杆</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="music-toggle">背景音乐</label>
          <input type="checkbox" id="music-toggle" checked>
        </div>
      </div>
      <button id="settings-close" class="settings-close" title="关闭" aria-label="关闭">×</button>
    </div>
  </div>
  <script src="../vip.js"></script>
  <script src="../star-economy.js"></script>
  <script src="../fx.js"></script>
  <script src="../lobby.js"></script>
  <script src="../game-invite-v0.js"></script>
  <script src="../vendor/howler/howler.core.min.js"></script>
  <script src="../game-audio.js"></script>
  <script src="../vendor/canvas-confetti/confetti.browser.min.js"></script>
  <script src="../vendor/tsParticles/tsparticles.slim.bundle.min.js"></script>
  <script src="../game-fx-lib.js"></script>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
