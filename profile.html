<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><link rel="stylesheet" href="app-shell.css"><link rel="stylesheet" href="platform.css"><title>个人档案 · 星糖宇宙</title></head>
<body class="app-page" data-tab="me">
<header class="app-topbar"><a href="me.html" class="app-profile" aria-label="返回我的宇宙"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span><b>个人档案</b></span></a></header>
<main class="app-main">
<div class="page-heading"><h1>个人档案</h1><p class="platform-label">💾 本地保存 · 未上传服务器</p></div>
<div class="profile-form">
<div class="form-group">
<label for="profileNickname">昵称</label>
<input type="text" id="profileNickname" placeholder="输入你的昵称" maxlength="16" aria-describedby="nicknameHint"><small id="nicknameHint" class="form-hint">最多 16 个字符</small>
</div>
<div class="form-group">
<label for="profileBio">签名</label>
<textarea id="profileBio" placeholder="分享一句话..." maxlength="60" rows="3" aria-describedby="bioHint"></textarea><small id="bioHint" class="form-hint">最多 60 个字符</small>
</div>
<div class="form-group">
<label>头像</label>
<div class="avatar-picker" role="group" aria-label="选择头像">
<button type="button" class="avatar-option" data-avatar="whale" aria-label="鲸鱼头像"><img src="assets/avatar-whale.webp" alt=""></button>
<button type="button" class="avatar-option" data-avatar="fox" aria-label="狐狸头像"><img src="assets/avatar-fox.webp" alt=""></button>
<button type="button" class="avatar-option" data-avatar="lunar" aria-label="月兔头像"><img src="assets/avatar-lunar.webp" alt=""></button>
<button type="button" class="avatar-option" data-avatar="pearl" aria-label="珍珠头像"><img src="assets/avatar-pearl.webp" alt=""></button>
<button type="button" class="avatar-option" data-avatar="pink" aria-label="粉樱头像"><img src="assets/avatar-pink.webp" alt=""></button>
<button type="button" class="avatar-option" data-avatar="raven" aria-label="乌鸦头像"><img src="assets/avatar-raven.webp" alt=""></button>
<button type="button" class="avatar-option" data-avatar="silver" aria-label="银月头像"><img src="assets/avatar-silver.webp" alt=""></button>
<button type="button" class="avatar-option" data-avatar="forest" aria-label="森林头像"><img src="assets/avatar-forest.webp" alt=""></button>
</div>
<small class="form-hint">或在账号中上传云端头像</small>
</div>
<div class="form-group">
<label class="checkbox-label"><input type="checkbox" id="profilePrivacy" aria-describedby="privacyDesc"><span>隐藏我的档案预览</span></label><small id="privacyDesc" class="form-hint">仅本地隐藏，不影响服务器隐私设置</small>
</div>
<div class="form-actions">
<button type="button" id="profileSave" class="action-button primary">保存</button>
<button type="button" id="profileReset" class="action-button secondary">重置</button>
</div>
</div>
<div id="profileStatus" class="form-status" role="status" aria-live="polite"></div>
</main>
<nav class="app-tabs" aria-label="主导航"></nav>
<script src="app-shell.js"></script><script src="platform.js"></script><script src="vip.js"></script>
</body></html>
