<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文本排版清洗</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#294b3c;font:16px system-ui,sans-serif}header,main,footer{max-width:1020px;margin:auto;padding:24px}h1{font-size:26px}main{display:grid;grid-template-columns:340px 1fr;gap:24px}.panel,.result{background:#fff;border:1px solid #e0e4d8;border-radius:22px;padding:24px;min-width:0}label{display:block;margin:15px 0 7px;font-size:14px}input,textarea,select,button{font:inherit;border-radius:10px;padding:11px;width:100%;border:1px solid #cbd6ca}textarea{min-height:180px;resize:vertical}button{background:#315c48;color:white;border:0;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}canvas,img{max-width:100%;height:auto}footer{text-align:center;font-size:13px;line-height:2}a{color:#315c48}small,.hint{color:#718075;font-size:13px}.card{padding:14px;background:#f5f3ec;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}#notice{white-space:pre-wrap}input[type=checkbox]{width:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}@media(max-width:720px){main{grid-template-columns:1fr;padding:14px}header{padding:22px}h1{font-size:23px}}</style><header><h1>文本排版清洗</h1><small>把日常的小事，做得轻松一点 · 本地处理，不上传内容</small></header><main><section class="panel"><label for="src">原始文本</label><textarea id="src" placeholder="粘贴需要整理的文字"></textarea><label><input type="checkbox" id="blank" checked> 合并多余空行</label><label><input type="checkbox" id="space" checked> 清理行首尾和连续空格</label><label for="punct">标点规范</label><select id="punct"><option value="none">保持原样</option><option value="cn">转中文全角标点</option><option value="en">转英文半角标点</option></select><label for="bullet">列表符号</label><select id="bullet"><option value="">不添加</option><option>🌿</option><option>✨</option><option>🌷</option><option>🍀</option><option>🧸</option></select><button id="clean">整理文本</button><button id="copy">复制结果</button><p id="notice" role="status"></p></section><section class="result"><label for="out">整理结果（可编辑）</label><textarea id="out" style="min-height:400px"></textarea></section></main><footer>需要定制可以闲鱼找我<br><a href="../tools.html">← 更多小工具</a></footer><script src="../vip.js"></script><script>const $=id=>document.getElementById(id);function save(c,name){const a=document.createElement('a');a.download=name;a.href=c.toDataURL('image/png');a.click()}async function copy(t){try{await navigator.clipboard.writeText(t);$('notice').textContent='已复制'}catch(e){$('notice').textContent='自动复制不可用，请长按或选中文字复制'}}function mark(c){if(!VIP.active()){const x=c.getContext('2d');x.save();x.font=`${Math.max(18,c.width/28)}px sans-serif`;x.textAlign='right';x.fillStyle='#888';x.fillText('免费版',c.width-18,c.height-22);x.restore()}}const palettes=[['#f5f1e6','#304c3e'],['#fff0e8','#874c3f'],['#e9efff','#3e497b'],['#302e38','#fff2d9'],['#fff7cc','#71562f']];function colors(){return palettes[VIP.active()?+$('color').value:Math.min(1,+$('color').value)]}function wrap(ctx,t,max){let lines=[''];for(const ch of t){if(ch==='\n'){lines.push('');continue}let i=lines.length-1;if(ctx.measureText(lines[i]+ch).width>max)lines.push(ch);else lines[i]+=ch}return lines}
function clean(){let t=$('src').value.replace(/\r\n?/g,'\n');if($('space').checked)t=t.split('\n').map(s=>s.trim().replace(/[ \t　]+/g,' ')).join('\n').trim();if($('blank').checked)t=t.replace(/\n(?:[ \t]*\n)+/g,'\n\n');const cn='，。！？：；（）',en=',.!?:;()';if($('punct').value!=='none'){const a=$('punct').value==='cn'?en:cn,b=$('punct').value==='cn'?cn:en;t=Array.from(t,c=>a.includes(c)?b[a.indexOf(c)]:c).join('')}let bullet=$('bullet').value;if(bullet&&!VIP.active()&&!['🌿','✨'].includes(bullet)){bullet='🌿';$('notice').textContent='免费版可选前两款符号'}if(bullet)t=t.split('\n').map(s=>s?bullet+' '+s:s).join('\n');$('out').value=t}$('clean').onclick=clean;$('copy').onclick=()=>copy($('out').value);</script></html>
