<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><link rel="icon" href="data:,"><link rel="stylesheet" href="../style.css"><title>栗栗的森林消消</title><style> #board{position:relative;width:100%;aspect-ratio:7/8;background:#e8f0dc;border-radius:18px;overflow:hidden}.t{position:absolute;width:13.5%;aspect-ratio:1;border-radius:10px;background:#fffdf5;border:2px solid #c9b48a;box-shadow:0 4px 0 #b89b68;display:flex;align-items:center;justify-content:center;font-size:min(7vw,34px);cursor:pointer;transition:filter .2s}.t.lock{filter:brightness(.55);cursor:default}#slot{display:flex;gap:4px;margin-top:10px;background:#7a5a3a;padding:6px;border-radius:12px;min-height:56px}#slot div{width:13%;aspect-ratio:1;background:#fffdf5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:min(6vw,28px)}</style>
<body class="game"><header class="page-head"><h1>🍂 栗栗的森林消消</h1><div class="bar"><span>第 <b id="lv">1</b> 关 · 剩 <b id="left">0</b> 块 · 最高 <b id="best">1</b> 关</span></div></header>
<main><div id="board"></div><div id="slot"></div><div class="bar" style="margin-top:10px"><button id="restart" class="alt">重来本关</button><button id="undo">↩ 撤回（VIP）</button><button id="shuffle">🔀 洗牌（VIP）</button></div><p id="msg" role="status"></p><p class="hint">点没被压住的方块放进槽里，三个一样就消掉。槽满 7 个就失败。</p></main>
<footer>需要定制可以闲鱼找我<br><a href="../tools.html">← 更多小工具</a></footer><script src="../ui.js"></script><script src="../vip.js"></script><script>
const $=i=>document.getElementById(i),ICON=['🌰','🍄','🍁','🐿️','🌲','🍎','🦔','🌼','🐝','🍯','🥕','🐞'];
let tiles,slot,hist,lv=1,dead,best=+localStorage.getItem('lili-match-best')||1;$('best').textContent=best;
function build(){const kinds=Math.min(4+lv,ICON.length),sets=3+lv*2,layers=Math.min(2+lv,6);let pool=[];for(let i=0;i<sets;i++){const k=ICON[i%kinds];pool.push(k,k,k)}pool.sort(()=>Math.random()-.5);tiles=pool.map((k,i)=>{const z=i%layers;return{k,z,id:i,x:Math.floor(Math.random()*(13-z%2))/2+ (z%2?0.25:0),y:Math.floor(Math.random()*(14-z%2))/2+(z%2?0.25:0)}});slot=[];hist=[];dead=false;$('lv').textContent=lv;$('msg').textContent='';render()}
function covered(t){return tiles.some(o=>o.z>t.z&&Math.abs(o.x-t.x)<1&&Math.abs(o.y-t.y)<1)}
function render(){const b=$('board');b.innerHTML='';[...tiles].sort((a,c)=>a.z-c.z).forEach(t=>{const d=document.createElement('div');d.className='t'+(covered(t)?' lock':'');d.textContent=t.k;d.style.left=(t.x/7*100*0.96+1)+'%';d.style.top=(t.y/8*100*0.96+1)+'%';d.style.zIndex=t.z;d.dataset.id=t.id;d.onclick=()=>pick(t);b.append(d)});$('slot').innerHTML=slot.map(t=>'<div>'+t.k+'</div>').join('');$('left').textContent=tiles.length+slot.length}
function pick(t){if(dead||covered(t))return;hist.push({tiles:tiles.slice(),slot:slot.slice()});tiles=tiles.filter(o=>o!==t);let i=slot.map(s=>s.k).lastIndexOf(t.k);slot.splice(i<0?slot.length:i+1,0,t);const same=slot.filter(s=>s.k===t.k);if(same.length>=3)slot=slot.filter(s=>s.k!==t.k);render();if(!tiles.length&&!slot.length){$('msg').textContent='过关啦！🎉 即将进入下一关';lv++;if(lv>best){best=lv;localStorage.setItem('lili-match-best',best);$('best').textContent=best}setTimeout(build,900)}else if(slot.length>=7){dead=true;$('msg').textContent='槽满啦～点「重来本关」或用 VIP 撤回'}}
$('restart').onclick=build;
$('undo').onclick=()=>{if(!VIP.active())return VIP.open();const h=hist.pop();if(!h)return;tiles=h.tiles;slot=h.slot;dead=false;$('msg').textContent='';render()};
$('shuffle').onclick=()=>{if(!VIP.active())return VIP.open();const ks=tiles.map(t=>t.k).sort(()=>Math.random()-.5);tiles.forEach((t,i)=>t.k=ks[i]);render()};
build();window.__game={pick,get tiles(){return tiles},covered};

UI.gameOverlay(document.getElementById('board'),{title:'栗栗的森林消消',desc:'点没被压住的方块，三个一样就消掉～',over:/槽满/,restartId:"restart"});
</script></html>
