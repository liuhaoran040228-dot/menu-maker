<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>邀请流程本地模拟</title><style>body{margin:0;background:#151a32;color:#fff;font:16px/1.6 system-ui;padding:22px}h1{font-size:22px}small{color:#bcc1d7}article{padding:18px;margin:16px 0;background:linear-gradient(135deg,#514873,#244d64);border:1px solid #c4b4f255;border-radius:22px}button,a{display:inline-block;color:white;background:#ffffff18;border:1px solid #ffffff55;border-radius:14px;padding:12px;text-decoration:none;margin:5px}select{padding:12px;background:#292743;color:white;border-radius:12px;width:100%}#state{color:#ffda95}</style></head><body><div style="position:fixed;top:0;left:0;right:0;background:#0b1029;z-index:50;text-align:center;font:12px system-ui;padding:6px">LOCAL MOCK · 非真实聊天</div><h1>聊天邀请 · 本地Mock验收</h1><small>这是测试夹具，不是已接入的真实聊天页</small><select id="game"></select><button id="send">发送测试邀请卡</button><p id="state"></p><main id="cards"></main><script src="../social/social-core.js"></script><script>
const proposed=[{id:'gomoku',name:'星弈 · 五子棋'},{id:'draw-guess',name:'绘梦 · 你画我猜'},{id:'whos-spy',name:'星语 · 谁是卧底'}];const allowed=[...StarSocialCore.GAMES,...proposed];for(const g of allowed){const o=document.createElement('option');o.value=g.id;o.textContent=g.name;document.querySelector('#game').append(o)}
async function refresh(){const items=await(await fetch('/__invite_mock/cards')).json();const list=document.querySelector('#cards');list.replaceChildren();for(const i of items){const g=allowed.find(g=>g.id===i.game_id);if(!g||i.version!==1)continue;const a=document.createElement('article');a.dataset.invite=i.invite_id;const title=document.createElement('h2');title.textContent=g.name;const score=document.createElement('p');score.className='score';score.textContent='自报分数（未验证）：'+(i.score===null?'暂无':i.score);const link=document.createElement('a');link.textContent=i.status==='open'?'打开游戏':'邀请已过期';if(i.status==='open')link.href='../'+g.id+'/?invite='+encodeURIComponent(i.invite_id);a.append(title,score,link);list.append(a)}const focus=new URLSearchParams(location.search).get('game_invite_return');if(focus)[...list.children].find(a=>a.dataset.invite===focus)?.scrollIntoView({block:'center'})}
document.querySelector('#send').onclick=async()=>{const b=document.querySelector('#send');b.disabled=true;try{const game=document.querySelector('#game').value;const nonceKey='mock-create-'+game;let n=sessionStorage.getItem(nonceKey);if(!n){n=crypto.randomUUID();sessionStorage.setItem(nonceKey,n)}const r=await(await fetch('/__invite_mock/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rpc:'community_chat_send_invite',params:{p_conversation_id:'00000000-0000-4000-8000-000000000099',p_game_id:game,p_score:null,p_client_nonce:n}})})).json();document.querySelector('#state').textContent=r.ok?'卡片已由本地Mock确认':'发送未确认';await refresh()}finally{b.disabled=false}};refresh();window.refreshCards=refresh;
</script></body></html>
