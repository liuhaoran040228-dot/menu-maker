<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九宫格切图</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#294b3c;font:16px system-ui,sans-serif}header,main,footer{max-width:1020px;margin:auto;padding:24px}h1{font-size:26px}main{display:grid;grid-template-columns:340px 1fr;gap:24px}.panel,.result{background:#fff;border:1px solid #e0e4d8;border-radius:22px;padding:24px;min-width:0}label{display:block;margin:15px 0 7px;font-size:14px}input,textarea,select,button{font:inherit;border-radius:10px;padding:11px;width:100%;border:1px solid #cbd6ca}textarea{min-height:180px;resize:vertical}button{background:#315c48;color:white;border:0;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}canvas,img{max-width:100%;height:auto}footer{text-align:center;font-size:13px;line-height:2}a{color:#315c48}small,.hint{color:#718075;font-size:13px}.card{padding:14px;background:#f5f3ec;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}#notice{white-space:pre-wrap}input[type=checkbox]{width:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}@media(max-width:720px){main{grid-template-columns:1fr;padding:14px}header{padding:22px}h1{font-size:23px}}</style><header><h1>九宫格切图</h1><small>把日常的小事，做得轻松一点 · 本地处理，不上传内容</small></header><main><section class="panel"><label for="file">选择图片</label><input id="file" type="file" accept="image/*"><p class="hint">居中裁切为正方形，再分成9张。按从左到右、从上到下编号。免费单张下载，VIP可一键下载全部。图片只在本机处理（最大20MB）。</p><button id="all" disabled>VIP：下载全部9张</button><p id="notice" role="status"></p></section><section class="result"><div id="preview" class="grid"></div></section></main><footer>需要定制可以闲鱼找我<br><a href="../tools.html">← 更多小工具</a></footer><script src="../vip.js"></script><script>const $=id=>document.getElementById(id);function save(c,name){const a=document.createElement('a');a.download=name;a.href=c.toDataURL('image/png');a.click()}async function copy(t){try{await navigator.clipboard.writeText(t);$('notice').textContent='已复制'}catch(e){$('notice').textContent='自动复制不可用，请长按或选中文字复制'}}function mark(c){if(!VIP.active()){const x=c.getContext('2d');x.save();x.font=`${Math.max(18,c.width/28)}px sans-serif`;x.textAlign='right';x.fillStyle='#888';x.fillText('免费版',c.width-18,c.height-22);x.restore()}}const palettes=[['#f5f1e6','#304c3e'],['#fff0e8','#874c3f'],['#e9efff','#3e497b'],['#302e38','#fff2d9'],['#fff7cc','#71562f']];function colors(){return palettes[VIP.active()?+$('color').value:Math.min(1,+$('color').value)]}function wrap(ctx,t,max){let lines=[''];for(const ch of t){if(ch==='\n'){lines.push('');continue}let i=lines.length-1;if(ctx.measureText(lines[i]+ch).width>max)lines.push(ch);else lines[i]+=ch}return lines}
let tiles=[];function render(img){tiles=[];$('preview').replaceChildren();const size=Math.min(img.naturalWidth,img.naturalHeight),step=size/3,out=Math.min(1080,Math.floor(step));if(out<1)throw Error('图片尺寸太小');for(let i=0;i<9;i++){const c=document.createElement('canvas');c.width=c.height=out;const x=c.getContext('2d');x.drawImage(img,(img.naturalWidth-size)/2+(i%3)*step,(img.naturalHeight-size)/2+Math.floor(i/3)*step,step,step,0,0,out,out);mark(c);tiles.push(c);const box=document.createElement('div'),b=document.createElement('button');b.textContent='下载 '+(i+1);b.onclick=()=>save(c,'九宫格-'+(i+1)+'.png');box.append(c,b);$('preview').append(box)}$('all').disabled=false}let image=null;$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;if(f.size>20*1024*1024){$('notice').textContent='请选择20MB以内图片';return}const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{try{image=img;render(img);$('notice').textContent='已切好，按编号保存'}catch(e){$('notice').textContent=e.message}URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);$('notice').textContent='无法读取图片，请选择 PNG / JPG / WebP'};img.src=url};$('all').onclick=async()=>{if(!VIP.active()){VIP.open();return}for(let i=0;i<tiles.length;i++){save(tiles[i],'九宫格-'+(i+1)+'.png');await new Promise(r=>setTimeout(r,250))}};window.addEventListener('vipchange',()=>{if(image)render(image)});</script></html>
