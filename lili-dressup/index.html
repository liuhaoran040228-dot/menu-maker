.set-card .lockbadge{position:absolute;inset:auto 8px 44px auto;z-index:3;background:linear-gradient(135deg,#ffd76b,#ff8fc8);color:#4a1640;font-weight:900;font-size:11px;padding:3px 8px;border-radius:10px}
.set-card-content{z-index:2;background:linear-gradient(0deg,rgba(20,5,25,.85),transparent 40%)}
.vip-ribbon{position:absolute;top:8px;left:-4px;background:linear-gradient(90deg,#ffcf6b,#ff7ac6);color:#3a0c33;font-weight:900;font-size:11px;padding:2px 10px;border-radius:0 10px 10px 0;z-index:3}
.item-tile.locked img{filter:grayscale(.5) brightness(.7)}
.locked-overlay{background:rgba(20,5,30,.45);backdrop-filter:blur(2px)}
.float-sparkle{position:absolute;pointer-events:none;z-index:11;color:#fff;text-shadow:0 0 8px #ff9be0,0 0 14px #fff;animation:fsp 4s ease-in-out infinite}
@keyframes fsp{0%{opacity:0;transform:translateY(10px) scale(.6)}50%{opacity:1}100%{opacity:0;transform:translateY(-60px) scale(1.1)}}
.transformation-overlay{background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,200,240,.85) 50%,rgba(170,90,255,.7))}
.transformation-text{font-size:36px;letter-spacing:4px;animation:tt 1.2s cubic-bezier(.2,.9,.3,1)}
@keyframes tt{0%{transform:translateX(-120%) scale(.8);opacity:0}30%{transform:none;opacity:1}100%{transform:scale(1.05)}}
.trans-ring{position:absolute;width:40vmin;height:40vmin;border-radius:50%;border:4px solid #fff;box-shadow:0 0 30px #ff7ac6,inset 0 0 30px #c26bff;animation:ring 1.2s ease-out forwards}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(3);opacity:0}}
.photo-hide-btn{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:101}
.items-grid{grid-auto-rows:118px;padding-bottom:64px}.item-tile{aspect-ratio:auto;height:118px}#screen-wardrobe .top-hud .hud-btn{min-width:36px;height:36px;padding:0 8px;font-size:17px}#screen-wardrobe .top-hud>div{flex-wrap:nowrap!important;gap:6px!important}.blink-l{opacity:0;animation:blinkk 4.6s infinite}@keyframes blinkk{0%,93%,100%{opacity:0}95%,97%{opacity:1}}@media (prefers-reduced-motion:reduce){.blink-l{animation:none}}html.qa .preview-banner,html.qa .account-trigger,html.qa #account-widget,html.qa .account-float{display:none!important}</style>
</head>
<body>
<script src="dressup-data.js"></script><script src="../qqshow.js"></script><script src="../vip.js"></script>
<div id="app"></div>
<canvas id="sparkle-canvas"></canvas>
<div class="loading-screen" id="loading">
<div class="loading-title">栗栗换装</div>
<div class="loading-bar"><div class="loading-progress" id="loading-progress"></div></div>
<div class="loading-text" id="loading-text">加载中...</div>
</div>
<script>
(function(){
'use strict';
const DATA=window.DressData;
const QA=new URLSearchParams(location.search).has('qa');if(QA)document.documentElement.classList.add('qa');
if(!DATA){alert('DressData not loaded');return}
const W=DATA.W,H=DATA.H;
let state={equipped:{},coins:1000,gems:50,level:5,avatar:'🦄',sound:true,lastDaily:null};
let undoStack=[];
let currentScreen='lobby';
let currentSlot='全部';
let currentStyle='全部';
let currentRarity='全部';
let currentColor='全部';
let currentScene='bg_studio';
let currentPose='站姿';
let currentExpr=null;
let currentFrame='无';
let currentFilter='原片';
let stickerOn=true;
let previewTimeout=null;
let previewItem=null;
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
function playSound(freq=800,dur=0.1){
if(!state.sound)return;
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.frequency.value=freq;
gain.gain.setValueAtTime(0.1,audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);
osc.start();
osc.stop(audioCtx.currentTime+dur);
}
function saveState(){
try{if(window.StarShow&&StarShow.save){const it={};Object.entries(state.equipped).forEach(([k,v])=>{const x=getItem(v);if(x&&isUnlocked(x))it[k]=v});StarShow.save({v:1,items:it,set:state.set||null});}}catch(e){}
try{
localStorage.setItem('lili-dressup-v1',JSON.stringify(state));
}catch(e){}
}
function loadState(){
try{
const saved=localStorage.getItem('lili-dressup-v1');
if(saved){
const loaded=JSON.parse(saved);
state={...state,...loaded};
}
}catch(e){}
}
loadState();
if(!state.equipped||!Object.keys(state.equipped).length){state.equipped={};(DATA.defaultOutfit||[]).forEach(id=>{const it=DATA.items.find(x=>x.id===id);if(it)state.equipped[it.slot]=id;});}
function isVip(){
return!!(window.VIP&&window.VIP.active&&window.VIP.active());
}
function tier(){
return window.VIP&&window.VIP.tier?window.VIP.tier()||0:0;
}
function isUnlocked(item){
if(!item.vip)return true;
const params=new URLSearchParams(location.search);
if(params.get('vip')==='preview')return false;
return isVip()&&tier()>=(item.minTier||0);
}
function render(){renderDoll();if(currentScreen==='wardrobe')renderWardrobe();if(currentScreen==='collection')renderCollection();}
window.addEventListener('vipchange',()=>{if(window.LiliDress)render();});
const params=new URLSearchParams(location.search);
if(params.get('screen')){
currentScreen=params.get('screen');
}
if(params.get('set')){
setTimeout(()=>{
const setId=params.get('set');
showSetDetail(setId);
},500);
}
function getItem(id){
return DATA.items.find(it=>it.id===id);
}
function getSet(id){
return DATA.sets.find(s=>s.id===id);
}
function getScene(id){
return DATA.scenes.find(sc=>sc.id===id);
}
function equipItem(id,silent=false){
const item=getItem(id);
if(!item)return;
if(!isUnlocked(item)){
showPreview(item);
return;
}
if(previewItem){
clearTimeout(previewTimeout);
previewItem=null;
document.querySelectorAll('.preview-banner').forEach(el=>el.remove());
}
undoStack.push({...state.equipped});
if(undoStack.length>30)undoStack.shift();
state.set=null;
if(state.equipped[item.slot]===id){
delete state.equipped[item.slot];
}else{
state.equipped[item.slot]=id;
}
saveState();
if(!silent){
playSound(1000,0.08);
burstSparkles();
}
renderDoll();
}
function equipSet(setId,silent=false){
const set=getSet(setId);
if(!set)return;
const allUnlocked=set.items.every(id=>isUnlocked(getItem(id)));
if(!allUnlocked){
showSetPreview(set);
return;
}
undoStack.push({...state.equipped});
state.equipped={};state.set=setId;
set.items.forEach(id=>{
const item=getItem(id);
if(item)state.equipped[item.slot]=id;
});
if(set.bg){
currentScene=set.bg;
}
saveState();
if(!silent){
showTransformation(set.name);
}
renderDoll();
renderScene();
}
function undo(){
if(undoStack.length===0)return;
state.equipped=undoStack.pop();
saveState();
playSound(700,0.08);
renderDoll();
}
function randomOutfit(){
const unlocked=DATA.items.filter(it=>isUnlocked(it));
const slots=[...new Set(unlocked.map(it=>it.slot))].filter(s=>s!=='expr');
undoStack.push({...state.equipped});
state.equipped={};
let delay=0;
slots.forEach(slot=>{
const choices=unlocked.filter(it=>it.slot===slot);
if(choices.length>0){
setTimeout(()=>{
const pick=choices[Math.floor(Math.random()*choices.length)];
state.equipped[slot]=pick.id;
playSound(1200+Math.random()*400,0.06);
burstSparkles();
renderDoll();
},delay);
delay+=120;
}
});
saveState();
}
function clearOutfit(){
undoStack.push({...state.equipped});
state.equipped={};
saveState();
playSound(600,0.1);
renderDoll();
}
function showScore(){
const slots=['hair','top','bottom','shoes','head','jewel','hand','makeup'];
const equipped=slots.map(s=>state.equipped[s]).filter(Boolean).map(getItem).filter(Boolean);
let score=0;
const styleCounts={};
equipped.forEach(it=>{
if(it.style)styleCounts[it.style]=(styleCounts[it.style]||0)+1;
const rarityScore={'N':1,'R':2,'SR':3,'SSR':4,'UR':5}[it.rarity]||0;
score+=rarityScore*10;
});
const maxStyle=Object.values(styleCounts).sort((a,b)=>b-a)[0]||0;
score+=maxStyle*15;
let rank='C';
let stars='⭐';
if(score>=150){rank='S';stars='⭐⭐⭐⭐⭐'}
else if(score>=100){rank='A';stars='⭐⭐⭐⭐'}
else if(score>=60){rank='B';stars='⭐⭐⭐'}
else if(score>=30){rank='C';stars='⭐⭐'}
playSound(1400,0.15);
burstSparkles();
showModal(`
<div class="score-display">
<div class="score-rank">${rank}</div>
<div class="score-stars">${stars}</div>
<div class="score-detail">
总分: ${score}<br>
风格一致性: ${maxStyle} 件<br>
稀有度加成: ${equipped.length} 件装备
</div>
</div>
`,[{text:'✨ 继续搭配',cb:closeModal}]);
}
function showPreview(item){
if(!item)return;
previewItem=item;
const prev=state.equipped[item.slot];
state.equipped[item.slot]=item.id;
renderDoll();
const banner=document.createElement('div');
banner.className='preview-banner';
banner.innerHTML=`
<h3>试穿预览</h3>
<p>VIP 专属 · 开通后永久解锁</p>
<div class="big-btn" style="max-width:200px;margin:0 auto" onclick="window.VIP&&window.VIP.open&&window.VIP.open()">💎 开通 VIP</div>
`;
document.getElementById('app').appendChild(banner);
clearTimeout(previewTimeout);
previewTimeout=setTimeout(()=>{
if(prev!==undefined)state.equipped[item.slot]=prev;
else delete state.equipped[item.slot];
renderDoll();
banner.remove();
previewItem=null;
},2500);
}
function showSetPreview(set){
const allItems=set.items.map(getItem).filter(Boolean);
const lockedItems=allItems.filter(it=>!isUnlocked(it));
showModal(`
<h3>${set.name}</h3>
<p style="color:rgba(255,255,255,0.7);margin-bottom:12px">${set.desc||''}</p>
<div class="set-preview-doll">
<div class="doll-container" id="set-preview-doll-temp"></div>
</div>
<div class="set-items-list">
${allItems.map(it=>`<span>${it.name}</span>`).join('')}
</div>
<p style="color:#fbbf24;font-size:14px;margin:12px 0">🔒 ${lockedItems.length} 件需要 VIP${set.minTier||''}</p>
`,[
{text:'✨ 试穿预览',cb:()=>{
closeModal();
const prev={...state.equipped};const prevSet0=state.set;
state.equipped={};state.set=set.id;set.items.forEach(id=>{
const item=getItem(id);
if(item)state.equipped[item.slot]=id;
});
if(set.bg)currentScene=set.bg;
renderDoll();
renderScene();
const banner=document.createElement('div');
banner.className='preview-banner';
banner.innerHTML=`
<h3>VIP 套装试穿</h3>
<p>开通 VIP${set.minTier||''} 永久解锁</p>
<div class="big-btn" style="max-width:200px;margin:0 auto" onclick="window.VIP&&window.VIP.open&&window.VIP.open()">💎 开通 VIP</div>
`;
document.getElementById('app').appendChild(banner);
const prevSet=prevSet0;setTimeout(()=>{
state.equipped=prev;state.set=prevSet;
renderDoll();
banner.remove();
},QA?60000:3000);
}},
{text:'💎 开通 VIP',cb:()=>{
closeModal();
window.VIP&&window.VIP.open&&window.VIP.open();
}}
]);
setTimeout(()=>{
const tempDoll=document.getElementById('set-preview-doll-temp');
if(tempDoll){
const tempEquipped={};
set.items.forEach(id=>{
const item=getItem(id);
if(item)tempEquipped[item.slot]=id;
});
renderDollTo(tempDoll,tempEquipped,set.id);
}
},100);
}
function showSetDetail(setId){
const set=getSet(setId);
if(!set)return;
const allItems=set.items.map(getItem).filter(Boolean);
const unlocked=allItems.filter(isUnlocked);
const owned=allItems.filter(it=>state.equipped[it.slot]===it.id||isUnlocked(it));
const isLocked=unlocked.length<allItems.length;
showModal(`
<h3>${set.name}</h3>
<p style="color:rgba(255,255,255,0.7);margin-bottom:12px">${set.desc||''}</p>
<div class="set-preview-doll">
<div class="doll-container" id="set-detail-doll-temp"></div>
</div>
<div class="set-items-list">
${allItems.map(it=>`<span>${it.name}${isUnlocked(it)?'':'🔒'}</span>`).join('')}
</div>
<p style="font-size:12px;color:rgba(255,255,255,0.6);margin:8px 0">拥有进度: ${owned.length}/${allItems.length}</p>
${isLocked?`<p style="color:#fbbf24;font-size:14px;margin:8px 0">需要 VIP${set.minTier||''} 解锁全套</p>`:''}
`,[
{text:isLocked?'💎 开通 VIP':'✨ 一键穿戴',cb:()=>{
closeModal();
if(isLocked){
window.VIP&&window.VIP.open&&window.VIP.open();
}else{
equipSet(setId);
showScreen('wardrobe');
}
}},
{text:'❌ 关闭',cb:closeModal}
]);
setTimeout(()=>{
const tempDoll=document.getElementById('set-detail-doll-temp');
if(tempDoll){
const tempEquipped={};
set.items.forEach(id=>{
const item=getItem(id);
if(item)tempEquipped[item.slot]=id;
});
renderDollTo(tempDoll,tempEquipped,set.id);
}
},100);
}
function showTransformation(name){
const overlay=document.createElement('div');
overlay.className='transformation-overlay active';
overlay.innerHTML=`
<div class="transformation-rays"></div><div class="trans-ring"></div><div class="trans-ring" style="animation-delay:.25s"></div>
<div class="transformation-text">${name}</div>
`;
document.body.appendChild(overlay);
playSound(1600,0.3);
burstSparkles();
setTimeout(()=>{
overlay.classList.remove('active');
setTimeout(()=>overlay.remove(),300);
},1200);
}
function showModal(content,buttons=[]){
const existing=document.querySelector('.modal-overlay');
if(existing)existing.remove();
const overlay=document.createElement('div');
overlay.className='modal-overlay active';
const btnsHTML=buttons.map(b=>`<div class="big-btn" onclick="window._modalCb_${buttons.indexOf(b)}()">${b.text}</div>`).join('');
overlay.innerHTML=`<div class="modal">${content}<div class="modal-buttons">${btnsHTML}</div></div>`;
document.body.appendChild(overlay);
buttons.forEach((b,i)=>{
window[`_modalCb_${i}`]=()=>{
if(b.cb)b.cb();
};
});
overlay.addEventListener('click',e=>{
if(e.target===overlay)closeModal();
});
}
function closeModal(){
const overlay=document.querySelector('.modal-overlay');
if(overlay){
overlay.classList.remove('active');
setTimeout(()=>overlay.remove(),300);
}
}
function showScreen(screen){
currentScreen=screen;
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
const target=document.getElementById(`screen-${screen}`);
if(target){
target.classList.add('active');
if(screen==='lobby'){if(window.__lobbyShow)setTimeout(window.__lobbyShow,0);
const doll=target.querySelector('.doll-container');
if(doll)doll.classList.add('breathing');
}else{
document.querySelectorAll('.doll-container').forEach(d=>d.classList.remove('breathing'));
}
}
if(screen==='wardrobe'){
renderWardrobe();
}else if(screen==='collection'){
renderCollection();
}else if(screen==='photo'){
renderPhoto();
}
}
function renderDoll(container){
const cont=container||document.querySelectorAll('.screen:not(#screen-lobby)>.doll-stage>.doll-container');
cont.forEach(c=>{
renderDollTo(c,state.equipped);
});
}
const IMC={};function im(src){if(!IMC[src]){const i=new Image();i.src=src;IMC[src]=i}return IMC[src]}
function ready(i){return i.complete&&i.naturalWidth?Promise.resolve(i):new Promise(r=>{i.onload=()=>r(i);i.onerror=()=>r(i)})}
function baseCanvas(eq){const c=document.createElement('canvas');c.width=W;c.height=H;const b=DATA.base;const er=Object.values(eq).map(getItem).filter(it=>it&&it.erase&&(it.slot!=='bottom'||!(getItem(eq.top)||{}).full)).map(it=>it.erase);Promise.all([b,...er].map(x=>ready(im(x.src)))).then(()=>{const g=c.getContext('2d');g.drawImage(im(b.src),b.x,b.y,b.w,b.h);g.globalCompositeOperation='destination-out';er.forEach(e=>g.drawImage(im(e.src),e.x,e.y,e.w,e.h));});return c}
function baseFor(eq){return DATA.base;const t=getItem(eq.top),b=getItem(eq.bottom);if(t&&t.baseAlt)return t.baseAlt;if(b&&b.baseAlt&&!(t&&t.full))return b.baseAlt;return DATA.base}
function withDefaults(eq){eq={...eq};const df=DATA.defaults||{};if(!eq.top&&df.top)eq.top=df.top;const t=getItem(eq.top);if(!eq.bottom&&df.bottom&&!(t&&t.full))eq.bottom=df.bottom;return eq}
function renderDollTo(container,equipped,setId){
setId=setId===undefined?(equipped===state.equipped?state.set:null):setId;const ST=setId&&getSet(setId);
if(ST&&ST.illus&&ST.items.every(id=>equipped[getItem(id).slot]===id)){const had=container.querySelector('.illus');container.innerHTML='';const im=document.createElement('img');im.className='illus'+(had?'':' pop-in');im.src=ST.illus.src;Object.assign(im.style,{left:ST.illus.x/W*100+'%',top:ST.illus.y/H*100+'%',width:ST.illus.w/W*100+'%',height:ST.illus.h/H*100+'%',zIndex:20});container.appendChild(im);return}
const prevSrc=new Set([...container.querySelectorAll('img')].map(i=>i.getAttribute('src')));const first=!container.children.length;
container.innerHTML='';
const layers=[];
layers.push({isBase:true,z:20});
Object.values(equipped).forEach(id=>{
const item=getItem(id);
if(!item)return;
if(item.slot==='bottom'){
const topItem=getItem(equipped.top);
if(topItem&&topItem.full)return;
}
if(item.layers){
item.layers.forEach(l=>layers.push(l));
}
});
equipped=withDefaults(equipped);
if(DATA.blink)layers.push({...DATA.blink,blink:true});
layers.sort((a,b)=>(a.z||0)-(b.z||0));
layers.forEach(l=>{
if(l.isBase){const c=baseCanvas(equipped);c.className='base-cv';c.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;z-index:20;pointer-events:none';container.appendChild(c);return}
const img=document.createElement('img');
img.src=l.src;
img.style.left=(l.x/W*100)+'%';
img.style.top=(l.y/H*100)+'%';
img.style.width=(l.w/W*100)+'%';
img.style.height=(l.h/H*100)+'%';
img.style.zIndex=l.z||0;
img.onerror=()=>img.style.display='none';
if(!first&&!prevSrc.has(l.src))img.className='pop-in';
if(l.blink)img.className='blink-l';
container.appendChild(img);
});
}
function renderScene(){
document.querySelectorAll('#screen-wardrobe .scene-bg,#screen-photo .scene-bg').forEach(sceneBg=>{
if(currentScene){
const scene=getScene(currentScene);
if(scene){
sceneBg.innerHTML=`<img src="${scene.src}" alt="${scene.name}">`;
sceneBg.style.opacity='1';
return;
}
}
sceneBg.innerHTML='';
sceneBg.style.opacity='0';
});
}
function renderWardrobe(){
const panel=document.getElementById('wardrobe-panel');
if(!panel)return;
const slots=DATA.slots;
const slotId=currentSlot==='全部'?null:slots.find(s=>s.name===currentSlot)?.id;
let items=DATA.items.filter(it=>!slotId||it.slot===slotId);
if(currentStyle!=='全部'){
const styleId=currentStyle;
items=items.filter(it=>it.style===styleId);
}
if(currentRarity!=='全部'){
items=items.filter(it=>it.rarity===currentRarity);
}
if(currentColor!=='全部'){
const colorId=DATA.colors.find(c=>c.name===currentColor)?.id;
items=items.filter(it=>it.color===colorId);
}
const grid=panel.querySelector('.items-grid');
if(!grid)return;
grid.innerHTML='';
items.forEach(item=>{
const tile=document.createElement('div');
const equipped=state.equipped[item.slot]===item.id;
const locked=!isUnlocked(item);
tile.className=`item-tile rarity-${item.rarity}${locked?' locked':''}`;
const mainLayer=item.layers&&item.layers[0];
const imgSrc=mainLayer?mainLayer.src:DATA.base.src;
tile.innerHTML=`
${locked?`<div class="locked-overlay"><div class="lock-icon">🔒</div><div class="vip-text">VIP${item.minTier||''}</div></div>`:''}
<img src="${imgSrc}" loading="lazy">
<div class="item-frame"></div>
<div class="rarity-badge">${item.rarity}</div>
${equipped?'<div class="equipped-mark">✓</div>':''}
<div class="item-name">${item.name}</div>
`;
tile.addEventListener('click',()=>{
equipItem(item.id);
renderWardrobe();
});
grid.appendChild(tile);
});
}
function renderCollection(){
const modal=document.getElementById('collection-grid');
if(!modal)return;
modal.innerHTML='';
DATA.sets.forEach(set=>{
const allItems=set.items.map(getItem).filter(Boolean);
const owned=allItems.filter(it=>isUnlocked(it));
const unlocked=allItems.length>0&&allItems.every(isUnlocked);
const card=document.createElement('div');
card.className=`set-card rarity-${set.rarity}${unlocked?'':' locked'}`;
const scene=set.bg?getScene(set.bg):null;
const bgStyle=scene?`background-image:url(${scene.src})`:'';
const styleIcon=DATA.styles.find(s=>s.id===set.style)?.icon||'✨';
card.innerHTML=`
<div class="set-card-bg" style="${bgStyle}"></div><div class="mini"><div class="doll-container"></div></div>${set.vip?`<div class="vip-ribbon">VIP${set.minTier||''}</div>`:''}${unlocked?'':'<div class="lockbadge">🔒 未解锁</div>'}
<div class="set-card-content">
<div class="set-card-header">
<span style="font-size:24px">${styleIcon}</span>
${set.vip&&!unlocked?`<span style="font-size:20px">🔒</span>`:''}
</div>
<div>
<div class="set-card-name">${set.name}</div>
<div class="set-card-info">${owned.length}/${allItems.length} | ${set.rarity}</div>
</div>

function initSparkles(){
const canvas=document.getElementById('sparkle-canvas');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
const particles=[];
function addParticle(x,y){
for(let i=0;i<46;i++){
particles.push({
x:x,
y:y,
vx:(Math.random()-0.5)*9,
vy:(Math.random()-0.5)*9-3,star:Math.random()<.6,
life:1,
size:Math.random()*4+2,
color:`hsl(${Math.random()*60+300},100%,${Math.random()*30+60}%)`
});
}
}
function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.x+=p.vx;
p.y+=p.vy;
p.vy+=0.12;p.vx*=.98;
p.life-=0.02;
if(p.life<=0){
particles.splice(i,1);
continue;
}
ctx.globalAlpha=p.life;
ctx.fillStyle=p.color;
ctx.beginPath();if(p.star){for(let j=0;j<8;j++){const a=j*Math.PI/4+p.life*3,rr=j%2?p.size*.4:p.size*1.8;ctx.lineTo(p.x+Math.cos(a)*rr,p.y+Math.sin(a)*rr)}}else ctx.arc(p.x,p.y,p.size*.6,0,Math.PI*2);
ctx.shadowColor='#fff';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
}
ctx.globalAlpha=1;
requestAnimationFrame(animate);
}
animate();
window.burstSparkles=()=>{
const d=document.querySelector('.screen.active .doll-container');let x=innerWidth/2,y=innerHeight*.4;if(d){const r=d.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height*.42}addParticle(x,y);
};
}

const loading=document.getElementById('loading');

const text=document.getElementById('loading-text');
const toLoad=[];
toLoad.push(DATA.base.src);
DATA.items.forEach(item=>{
if(item.layers){
item.layers.forEach(l=>toLoad.push(l.src));
}
});
DATA.scenes.forEach(sc=>toLoad.push(sc.src));
toLoad.push(DATA.lobbyBg);
let loaded=0;
let total=Math.min(toLoad.length,50);
const imagesToPreload=toLoad.slice(0,total);
function updateProgress(){
progress.style.width=((loaded/total)*100)+'%';
text.textContent=`加载中... ${loaded}/${total}`;
if(loaded>=total){
setTimeout(()=>{
loading.style.opacity='0';
setTimeout(()=>{
loading.remove();
init();
},300);
},300);
}
}
imagesToPreload.forEach(src=>{
const img=new Image();
img.onload=img.onerror=()=>{
loaded++;
updateProgress();
};
img.src=src;
});
if(total===0){
loaded=total;
updateProgress();
}
}
preload();
})();
</script>
</body>
</html>
