<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><link rel="icon" href="data:,"><link rel="stylesheet" href="../style.css"><title>栗栗的美食 2048</title><style> #g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#d9c7a8;padding:8px;border-radius:16px;touch-action:none;user-select:none}#g div{aspect-ratio:1;border-radius:10px;background:#efe3cc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:min(9vw,40px)}#g small{font-size:11px;color:#6b5a40}</style>
<body class="game"><header class="page-head"><h1>🍱 栗栗的美食 2048</h1><div class="bar"><span>分数 <b id="score">0</b> · 最高 <b id="best">0</b></span><select id="skin"><option value="0">甜点铺</option><option value="1">水果摊 · VIP</option><option value="2">深夜食堂 · VIP</option></select></div></header>
<main><div id="g"></div><div class="bar" style="margin-top:10px"><button id="restart" class="alt">重新开始</button><button id="undo">↩ 撤回一步（VIP）</button></div><p id="msg" role="status"></p><p class="hint">上下左右滑动（电脑可用方向键），相同美食合成升级，目标：🏆！</p></main>
<footer>需要定制可以闲鱼找我<br><a href="../tools.html">← 更多小工具</a></footer><script src="../ui.js"></script><script src="../vip.js"></script><script>
const $=i=>document.getElementById(i);
const SK=[['🌰','🍪','🧁','🍩','🍰','🥧','🍮','🎂','🍯','👑','🏆'],['🍒','🍓','🍊','🍋','🍑','🍎','🍐','🍉','🍍','👑','🏆'],['🍙','🍜','🍢','🥟','🍤','🍣','🍲','🍱','🦀','👑','🏆']];
const BG=['#fff3d6','#ffe2b8','#ffd09a','#ffbd7a','#ffa95e','#ff9448','#f97c3a','#f2c94c','#f0b429','#e6a700','#ffd700'];
let g,score,hist,best=+localStorage.getItem('lili-2048-best')||0;$('best').textContent=best;
function skin(){return VIP.active()?+$('skin').value:0}
function add(){const e=[];g.forEach((v,i)=>{if(!v)e.push(i)});if(e.length)g[e[Math.random()*e.length|0]]=Math.random()<.9?1:2}
function reset(){g=Array(16).fill(0);score=0;hist=[];add();add();$('msg').textContent='';render()}
function render(){const s=skin();$('g').innerHTML=g.map(v=>v?'<div style="background:'+BG[v-1]+'">'+SK[s][v-1]+'<small>'+(2**v)+'</small></div>':'<div></div>').join('');$('score').textContent=score}
function line(a){a=a.filter(v=>v);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]&&a[i]<11){a[i]++;score+=2**a[i];a.splice(i+1,1);if(a[i]===11)$('msg').textContent='合成奖杯！太厉害啦🏆'}while(a.length<4)a.push(0);return a}
function move(d){const before=g.join(),snap={g:g.slice(),score};for(let k=0;k<4;k++){let idx=[0,1,2,3].map(i=>d==='L'?k*4+i:d==='R'?k*4+3-i:d==='U'?i*4+k:(3-i)*4+k);const r=line(idx.map(i=>g[i]));idx.forEach((i,j)=>g[i]=r[j])}if(g.join()!==before){hist.push(snap);if(hist.length>20)hist.shift();add();render();if(score>best){best=score;localStorage.setItem('lili-2048-best',best);$('best').textContent=best}if(stuck())$('msg').textContent='没法再动啦，得分 '+score}}
function stuck(){if(g.includes(0))return false;for(let i=0;i<16;i++){if(i%4<3&&g[i]===g[i+1])return false;if(i<12&&g[i]===g[i+4])return false}return true}
let sx,sy;const el=$('g');el.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});el.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))});
addEventListener('keydown',e=>{const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[e.key];if(m){e.preventDefault();move(m)}});
$('restart').onclick=reset;$('undo').onclick=()=>{if(!VIP.active())return VIP.open();const h=hist.pop();if(h){g=h.g;score=h.score;$('msg').textContent='';render()}};
$('skin').onchange=()=>{if(!VIP.active()&&$('skin').value!=='0')VIP.open();render()};addEventListener('vipchange',render);
UI.gameOverlay(document.getElementById('g'),{title:'栗栗的美食 2048',desc:'滑动合成美食，向 🏆 冲鸭！',over:/没法再动/,restartId:"restart"});reset();window.__game={move,get g(){return g}};
</script></html>
