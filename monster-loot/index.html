<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><link rel="stylesheet" href="../style.css"><title>萌娘星糖远征 · 打怪刷装备</title><style>.loot-stats{display:flex;gap:7px;flex-wrap:wrap;font-size:12px;background:#fff;padding:10px;border-radius:15px}.equip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.gear-slot,.gear-card{background:#ffffffc9;border:1px solid #e6def4;border-radius:16px;padding:10px;font-size:11px;min-width:0}.gear-slot b,.gear-card b{display:block}.gear-slot button,.gear-card button{font-size:11px;padding:6px;margin-top:5px;border-radius:9px}.gear-icon{width:30px;height:30px;display:block}.bag{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.gear-card{border-top:4px solid var(--rarity)}.gear-card b{color:var(--rarity)}.gear-card .gear-actions{display:flex;gap:5px}.loot-log{font-size:11px;background:#fff8;border-radius:12px;padding:10px;max-height:75px;overflow:auto}.loot-log p{margin:2px 0}</style><link rel="stylesheet" href="../mobile-game.css"></head><body class="game arcade" data-game="loot"><header class="page-head"><h1>萌娘星糖远征 ✦</h1><p>自动战斗 · 随机掉落 · 合成装备 · 本地存档</p></header><main><div class="game-banner"><span id="buddy"></span><div><b>和栗栗一起，寻找闪光宝物</b>普通怪掉装备，每五关挑战糖晶首领。</div></div><div class="hud"><span>第 <b id="stage">1</b> 关 · 最高 <b id="best">1</b></span><span>金币 <b id="coins">0</b></span></div><div class="loot-stats" id="stats"></div><canvas id="arena" width="420" height="300" aria-label="远征战斗区域"></canvas><div class="controls"><button id="start">开始远征</button><button id="strike">星光连斩 J</button><button id="heal" class="alt">回复 K</button></div><div class="arcade-settings"><label>免费伙伴<select id="character"></select></label><label>装扮<select id="skin"><option value="0">原色 · 免费</option><option value="1">樱糖 · VIP</option><option value="2">星河 · VIP</option></select></label></div><p class="hint"><b data-flavor="lootTip"></b><br>自动攻击；J 连斩冷却 5 秒，K 回复冷却 15 秒。VIP 掉落率 +20 个百分点（50%→70%）；首领必掉精良以上。离开页面不产出收益。</p><p id="msg" role="status"></p><div class="loot-log" id="log" aria-live="polite"></div><h2 style="font-size:17px">✧ 我的装备</h2><div class="equip-grid" id="equipped"></div><h2 style="font-size:17px">宝物背包 <small id="bagcount"></small></h2><p class="hint">三件同部位、同稀有度、同等级装备可合成更高稀有度。升级花金币、最高 20 级；已装备的宝物不会被合成。满 60 件时新掉落转金币。</p><div id="bag" class="bag"></div></main><script>document.body.dataset.orientation="landscape";{const c=document.querySelector("canvas");if(c){c.width=840;c.height=Math.round(840*Math.min(innerWidth,innerHeight)/Math.max(innerWidth,innerHeight));}}</script><script src="../data/content.js"></script><script src="../data/flavor.js"></script><script src="../content.js"></script><script src="../data/scenes.js"></script><script src="../game-art.js"></script><script src="../chars.js"></script><script src="../ui.js"></script><script src="../vip.js"></script><script>document.querySelectorAll("[data-flavor]").forEach(e=>e.textContent=StarData.flavor[e.dataset.flavor]);</script><script src="game.js"></script><script src="../game-view.js"></script></body></html>
