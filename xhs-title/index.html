<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小红书标题 / 标签灵感</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#294b3c;font:16px system-ui,sans-serif}header,main,footer{max-width:1020px;margin:auto;padding:24px}h1{font-size:26px}main{display:grid;grid-template-columns:340px 1fr;gap:24px}.panel,.result{background:#fff;border:1px solid #e0e4d8;border-radius:22px;padding:24px;min-width:0}label{display:block;margin:15px 0 7px;font-size:14px}input,textarea,select,button{font:inherit;border-radius:10px;padding:11px;width:100%;border:1px solid #cbd6ca}textarea{min-height:180px;resize:vertical}button{background:#315c48;color:white;border:0;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}canvas,img{max-width:100%;height:auto}footer{text-align:center;font-size:13px;line-height:2}a{color:#315c48}small,.hint{color:#718075;font-size:13px}.card{padding:14px;background:#f5f3ec;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}#notice{white-space:pre-wrap}input[type=checkbox]{width:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}@media(max-width:720px){main{grid-template-columns:1fr;padding:14px}header{padding:22px}h1{font-size:23px}}</style><header><h1>小红书标题 / 标签灵感</h1><small>把日常的小事，做得轻松一点 · 本地处理，不上传内容</small></header><main><section class="panel"><label for="topic">主题</label><select id="topic"><option>日常分享</option><option>美食</option><option>旅行</option><option>小店经营</option><option>生活技巧</option></select><label for="keyword">关键词（逗号分隔）</label><input id="keyword" maxlength="60" value="周末,咖啡"><button id="generate">换一组灵感</button><button id="copy">复制结果</button><p class="hint">模板组合灵感，请按实际体验修改，不保证流量。免费每次3条，VIP每次8条。</p><p id="notice" role="status"></p></section><section class="result"><div id="out"></div></section></main><footer>需要定制可以闲鱼找我<br><a href="../tools.html">← 更多小工具</a></footer><script src="../vip.js"></script><script>const $=id=>document.getElementById(id);function save(c,name){const a=document.createElement('a');a.download=name;a.href=c.toDataURL('image/png');a.click()}async function copy(t){try{await navigator.clipboard.writeText(t);$('notice').textContent='已复制'}catch(e){$('notice').textContent='自动复制不可用，请长按或选中文字复制'}}function mark(c){if(!VIP.active()){const x=c.getContext('2d');x.save();x.font=`${Math.max(18,c.width/28)}px sans-serif`;x.textAlign='right';x.fillStyle='#888';x.fillText('免费版',c.width-18,c.height-22);x.restore()}}const palettes=[['#f5f1e6','#304c3e'],['#fff0e8','#874c3f'],['#e9efff','#3e497b'],['#302e38','#fff2d9'],['#fff7cc','#71562f']];function colors(){return palettes[VIP.active()?+$('color').value:Math.min(1,+$('color').value)]}function wrap(ctx,t,max){let lines=[''];for(const ch of t){if(ch==='\n'){lines.push('');continue}let i=lines.length-1;if(ctx.measureText(lines[i]+ch).width>max)lines.push(ch);else lines[i]+=ch}return lines}
let result='',turn=0;function gen(){const keys=$('keyword').value.split(/[,，\s]+/).filter(Boolean),k=keys[0]||'日常小事',topic=$('topic').value;const t=[`把${k}过成喜欢的样子`,`关于${k}，分享几个小细节`,`${k}日记｜今天也有小确幸`,`第一次尝试${k}的真实感受`,`我的${k}实用清单`,`原来${k}还能这样安排`,`给${k}留一点时间`,`${k}带来的小小变化`,`不赶时间的${k}`,`收藏这份${k}灵感`];result=Array.from({length:VIP.active()?8:3},(_,i)=>t[(turn+i)%t.length]).join('\n')+'\n\n'+[...new Set([topic,...keys,'日常记录'])].map(s=>'#'+s.replace(/[^\p{L}\p{N}]/gu,'')).join(' ');turn=(turn+3)%t.length;$('out').textContent=result;$('out').className='card'}$('generate').onclick=gen;$('copy').onclick=()=>copy(result);window.addEventListener('vipchange',gen);gen();</script></html>
